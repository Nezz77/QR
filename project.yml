name: QRGenerator
options:
  bundleIdPrefix: com.futuretech
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0

targets:
  QRGenerator:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: QRGenerator
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.futuretech.QRGenerator
        INFOPLIST_FILE: QRGenerator/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    info:
      path: QRGenerator/Info.plist
      properties:
        CFBundleName: QR Generator
        CFBundleDisplayName: QR Generator
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "13.0"
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "© 2026 Futuretech | NH"
